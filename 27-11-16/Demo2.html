
<html>
    <head>
        <title>Css Template</title>
        <link href="cat.png" rel="icon">

        <style>
            #maindiv {
                width: 900px;
                margin: auto;
            }

            #header {
                background: yellow;
                height: 180px;
            }

            #menu {
                background: greenyellow;
                height: 40px;
            }

            #content1 {
                background: aquamarine;
                height: 400px;
            }

            #footer {
                background: darkred;
                height: 30px;
            }

            #img {
                height: 80px;
                width: 80px;
                margin-top: 30px;
                margin-left: 40px;
            }

            #span {
                color: bisque;
                font-size: 30px;
                font-weight: bolder;
                font-style: italic;
                position: absolute;
                margin-top: 30px;
                margin-left: 150px;
            }
        </style>
    </head>

    <body>
        <div id="maindiv">

            <div id="header">
                <img src="cat.png" id="img">
                <span id="span">Educational Site</span>
            </div>

            <div id="menu">
                Menu Section
            </div>

            <div id="content1">
                Content Section
            </div>

            <div id="footer">
                Footer Section
            </div>

        </div>
    </body>
</html>
