<html>
    <body>
        <form method="post" action="success.html">
        <table border="1" align="center" bgcolor="aqua">
            <tr>
                <th colspan="2">Registration Form</th>
            </tr>
            <tr>
                <td>first name</td>
                <td><input type="text" placeholder="enter first name" required></td>
            </tr>

            <tr>
                <td>last name</td>
                <td><input type="text" placeholder="enter last name" required></td>
            </tr>

            <tr>
                <td>Mobile No.</td>
                <td><input type="text" placeholder="enter 10 digit mobile no." required></td>
            </tr>

            <tr>
                <td>dob</td>
                <td><input type="date" required></td>
            </tr>

            <tr>
                <td>gender</td>
                <td><input type="radio" value="male" name="gender" required>male
                    <input type="radio" value="female" name="gender" required>female
                </td>
            </tr>

             <tr>
                <td>Address</td>
                <td><textarea rows="3" cols="20"></textarea></td>
            </tr>

            <tr>
                <td>City</td>
                <td>
                    <select>
                        <option value="0">select city</option>
                        <option value="0">indore</option>
                        <option value="0">Goa</option>
                        <option value="0">chz republic</option>
                    </select>
                </td>
            </tr>

             <tr>
                <td>email id</td>
                <td><input type="email" required></td>
            </tr>

             <tr>
                <td>password</td>
                <td><input type="password" minlength="8" maxlength="13" required></td>
            </tr>

             <tr>
                <td>profile pic</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="create profile">
                    <input type="reset" value="clear all">
                </td>
            </tr>

        </table>
        </form>
    </body>
</html>
